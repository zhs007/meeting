[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-translator"
version = "0.1.0"
description = "macOS one-way real-time meeting translation prototypes using Gemini and OpenAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.34.0,<2",
    "numpy>=2.0.0,<3",
    "python-dotenv>=1.0.1,<2",
    "sounddevice>=0.5.0,<0.6",
    "websockets>=14.0,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9",
    "ruff>=0.6.0,<1",
]

[project.scripts]
meeting-translator = "meeting_translator.cli:main"
meeting-openai-translator = "meeting_openai_translator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
